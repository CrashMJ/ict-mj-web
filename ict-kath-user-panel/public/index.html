    <!-- Start of Onesignal notification Code -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      // Initialize OneSignal
    window.OneSignal = window.OneSignal || [];
    OneSignal.push(async function() {
      await OneSignal.init({
        appId: "d2a52bc5-9db3-4ece-8fc9-bda2cc82bdd4",
      });

      // Retrieve the OneSignal user ID
      OneSignal.getUserId().then(function(userId) {
        console.log('OneSignal User ID:', userId);
      }).catch(function(error) {
        console.error('Error getting OneSignal User ID:', error);
      });
    });

    // Retrieve the push subscription ID from the existing service worker
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.ready.then(function(registration) {
        return registration.pushManager.getSubscription();
      }).then(function(subscription) {
        if (subscription) {
          console.log('Push Subscription ID:', subscription.endpoint);
        } else {
          console.log('No push subscription found.');
        }
      }).catch(function(error) {
        console.error('Error getting push subscription:', error);
      });
    } else {
      console.error('Push API or Service Worker is not supported.');
    }
    </script>
